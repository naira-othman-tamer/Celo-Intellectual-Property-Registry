<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celo IP Registry - Immutable Proof of Innovation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تم تغيير رابط المكتبة لرابط أكثر استقراراً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gold-accent { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; }
        .gold-border { border-color: #D4AF37; }
        .certificate-shadow { box-shadow: 0 10px 40px rgba(212, 175, 55, 0.15); }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    
    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <svg class="w-8 h-8 gold-accent mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span class="text-2xl font-bold text-slate-800">Celo <span class="gold-accent">IP Registry</span></span>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="connectBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-6 py-2 rounded-lg font-medium transition-all duration-200">
                        Connect Wallet
                    </button>
                    <div id="walletStatus" class="hidden text-sm text-slate-600">
                        <span id="walletAddress" class="font-mono"></span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main id="mainContainer" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <!-- Landing View -->
        <section id="landingView" class="fade-in">
            <div class="text-center mb-16">
                <h1 class="text-5xl font-bold text-slate-900 mb-4">Immutable Proof of Innovation</h1>
                <p class="text-xl text-slate-600 max-w-3xl mx-auto leading-relaxed">
                    Secure your intellectual property on the <span class="font-bold text-slate-800">Celo Mainnet</span>. 
                    Create verifiable, timestamped records of your ideas.
                </p>
            </div>
            <div class="text-center">
                <button id="getStartedBtn" class="gold-bg hover:bg-amber-500 text-white px-8 py-4 rounded-lg font-semibold text-lg transition-all duration-200 shadow-lg">Get Started</button>
            </div>
        </section>

        <!-- Registry View -->
        <section id="registryView" class="hidden fade-in">
            <div class="max-w-3xl mx-auto">
                <div class="text-center mb-12">
                    <h2 class="text-4xl font-bold text-slate-900 mb-4">Register Your IP</h2>
                </div>
                <div id="connectPrompt" class="bg-amber-50 border-2 border-amber-300 rounded-xl p-8 mb-8 text-center">
                    <h3 class="text-2xl font-semibold text-slate-900 mb-2">Wallet Connection Required</h3>
                    <button id="connectBtn2" class="gold-bg hover:bg-amber-500 text-white px-6 py-3 rounded-lg font-semibold transition-all duration-200">Connect Wallet</button>
                </div>
                <div id="registryForm" class="hidden bg-white rounded-xl shadow-xl border border-slate-200 p-8">
                    <form id="ipForm">
                        <div class="mb-6">
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Title</label>
                            <input type="text" id="titleInput" required class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none">
                        </div>
                        <div class="mb-6">
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Owner Name</label>
                            <input type="text" id="ownerInput" required class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none">
                        </div>
                        <div class="mb-6">
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Description / Data</label>
                            <textarea id="descriptionInput" required rows="5" class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none"></textarea>
                        </div>
                        <button type="submit" id="registerBtn" class="w-full gold-bg hover:bg-amber-500 text-white px-6 py-4 rounded-lg font-semibold text-lg shadow-lg">Register on Blockchain</button>
                    </form>
                </div>
                <div class="mt-8 text-center">
                    <button id="goToVerifyBtn" class="text-slate-600 hover:text-slate-800 font-medium underline">or verify an existing registration</button>
                </div>
            </div>
        </section>

        <!-- Verify View -->
        <section id="verifyView" class="hidden fade-in">
            <div class="max-w-3xl mx-auto">
                <div class="text-center mb-12">
                    <h2 class="text-4xl font-bold text-slate-900 mb-4">Verify Registration</h2>
                </div>
                <div class="bg-white rounded-xl shadow-xl border border-slate-200 p-8 mb-8">
                    <div class="flex space-x-4">
                        <input type="number" id="verifyIdInput" class="flex-1 px-4 py-3 border border-slate-300 rounded-lg outline-none" placeholder="Enter Record ID (e.g., 1)">
                        <button id="verifyBtn" class="gold-bg hover:bg-amber-500 text-white px-8 py-3 rounded-lg font-semibold">Verify</button>
                    </div>
                </div>
                <div id="verifyResult" class="hidden bg-white rounded-xl shadow-xl border border-slate-200 p-8 certificate-shadow"></div>
                <div class="mt-8 text-center">
                    <button id="backToRegistryBtn" class="text-slate-600 hover:text-slate-800 font-medium underline">← Back to Registry</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Success Modal -->
    <div id="successModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-8 certificate-shadow fade-in">
            <div class="text-center mb-6">
                <div class="w-20 h-20 gold-bg rounded-full flex items-center justify-center mx-auto mb-4">✓</div>
                <h3 class="text-3xl font-bold text-slate-900 mb-2">Successfully Registered!</h3>
            </div>
            <div class="bg-slate-50 rounded-lg p-6 mb-6 border-2 gold-border">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><p class="text-sm text-slate-500 font-semibold">ID</p><p id="modalRecordId" class="text-lg font-mono text-slate-900">-</p></div>
                    <div><p class="text-sm text-slate-500 font-semibold">Timestamp</p><p id="modalTimestamp" class="text-lg text-slate-900">-</p></div>
                </div>
                <div class="mb-4"><p class="text-sm text-slate-500 font-semibold">Title</p><p id="modalTitle" class="text-lg text-slate-900">-</p></div>
                <div><p class="text-sm text-slate-500 font-semibold">Tx Hash</p><p id="modalTxHash" class="text-sm font-mono text-slate-700 break-all">-</p></div>
            </div>
            <button id="closeModalBtn" class="w-full gold-bg hover:bg-amber-500 text-white px-6 py-3 rounded-lg font-semibold">Close</button>
        </div>
    </div>

    <script>
        const contractAddress = "0x56CaAA7770A49CE9386C8329144B9585A83Fc402";
        const contractABI = [
            "function registerRecord(string memory _title, string memory _ownerName, string memory _data) public returns (uint256)",
            "function getRecord(uint256 _id) public view returns (address owner, uint256 timestamp, string memory title, string memory ownerName, string memory data)",
            "function recordCount() public view returns (uint256)",
            "event RecordRegistered(uint256 indexed id, address indexed owner, uint256 timestamp)"
        ];
        const CELO_MAINNET = {
            chainId: "0xa4ec", 
            chainName: "Celo Mainnet",
            nativeCurrency: { name: "CELO", symbol: "CELO", decimals: 18 },
            rpcUrls: ["https://forno.celo.org"],
            blockExplorerUrls: ["https://celoscan.io/"]
        };

        let provider, signer, contract, userAddress;

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask!");
            try {
                await window.ethereum.request({ method: "eth_requestAccounts" });
                // Use a fallback provider until connected
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                const { chainId } = await provider.getNetwork();
                if (chainId !== 42220) {
                    try {
                        await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CELO_MAINNET.chainId }] });
                    } catch (err) {
                        if (err.code === 4902) await window.ethereum.request({ method: "wallet_addEthereumChain", params: [CELO_MAINNET] });
                    }
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                }

                contract = new ethers.Contract(contractAddress, contractABI, signer);
                updateWalletUI();
                if (!document.getElementById("registryView").classList.contains("hidden")) {
                    document.getElementById("connectPrompt").classList.add("hidden");
                    document.getElementById("registryForm").classList.remove("hidden");
                }
            } catch (err) { alert("Connection Error: " + err.message); }
        }

        function updateWalletUI() {
            document.getElementById("walletAddress").textContent = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
            document.getElementById("walletStatus").classList.remove("hidden");
            document.getElementById("connectBtn").textContent = "Connected";
            document.getElementById("connectBtn2").textContent = "Connected";
        }

        async function registerIdea(title, owner, desc) {
            try {
                const btn = document.getElementById("registerBtn");
                const oldText = btn.innerText;
                btn.innerText = "Confirming..."; btn.disabled = true;

                const tx = await contract.registerRecord(title, owner, desc);
                btn.innerText = "Processing...";
                const receipt = await tx.wait();

                const event = receipt.events.find(e => e.event === 'RecordRegistered');
                const id = event.args.id.toNumber();
                const block = await provider.getBlock(receipt.blockNumber);

                document.getElementById("modalRecordId").textContent = `#${id}`;
                document.getElementById("modalTimestamp").textContent = new Date(block.timestamp * 1000).toLocaleString();
                document.getElementById("modalTitle").textContent = title;
                document.getElementById("modalTxHash").textContent = tx.hash;
                document.getElementById("successModal").classList.remove("hidden");

                document.getElementById("ipForm").reset();
                btn.innerText = oldText; btn.disabled = false;
            } catch (err) { 
                alert("Error: " + (err.reason || err.message)); 
                document.getElementById("registerBtn").innerText = "Register on Blockchain";
                document.getElementById("registerBtn").disabled = false;
            }
        }

        async function verifyRecord(id) {
            const div = document.getElementById("verifyResult");
            div.classList.remove("hidden"); div.innerHTML = "Searching...";
            try {
                let readContract = contract;
                if(!readContract) {
                    const p = new ethers.providers.JsonRpcProvider(CELO_MAINNET.rpcUrls[0]);
                    readContract = new ethers.Contract(contractAddress, contractABI, p);
                }
                const rec = await readContract.getRecord(id);
                div.innerHTML = `
                    <div class="border-b-4 gold-border pb-4 mb-6"><h3 class="text-2xl font-bold">Certificate Found</h3><p class="text-sm text-gray-500">Verified on Celo Mainnet</p></div>
                    <p><strong>ID:</strong> #${id}</p>
                    <p><strong>Date:</strong> ${new Date(rec.timestamp.toNumber()*1000).toLocaleString()}</p>
                    <p><strong>Title:</strong> ${rec.title}</p>
                    <p><strong>Owner:</strong> ${rec.ownerName}</p>
                    <div class="bg-green-100 p-2 mt-4 text-center text-green-800 rounded">✓ Authentic Record</div>
                `;
            } catch (e) { div.innerHTML = `<div class="text-red-500 text-center">Record #${id} not found.</div>`; }
        }

        // Handlers
        const show = (id) => { 
            ['landingView', 'registryView', 'verifyView'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        };
        document.getElementById("connectBtn").onclick = connectWallet;
        document.getElementById("connectBtn2").onclick = connectWallet;
        document.getElementById("getStartedBtn").onclick = () => show('registryView');
        document.getElementById("goToVerifyBtn").onclick = () => { show('verifyView'); document.getElementById("verifyResult").classList.add('hidden'); };
        document.getElementById("backToRegistryBtn").onclick = () => show('registryView');
        document.getElementById("closeModalBtn").onclick = () => document.getElementById("successModal").classList.add("hidden");
        document.getElementById("verifyBtn").onclick = () => verifyRecord(document.getElementById("verifyIdInput").value);
        document.getElementById("ipForm").onsubmit = (e) => { e.preventDefault(); registerIdea(document.getElementById("titleInput").value, document.getElementById("ownerInput").value, document.getElementById("descriptionInput").value); };
    </script>
</body>
</html>
